name: M35 profile

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: The source tree whose streams are decoded
        type: choice
        options:
          - silesia
          - dependencies
        default: silesia
        required: true
      codec:
        description: The codec to profile, or all three
        type: choice
        options:
          - all
          - zstd
          - xz
          - lzma
        default: all
        required: true
      target_cpu:
        description: baseline builds as M31 did; x86-64-v3 sets RUSTFLAGS="-C target-cpu=x86-64-v3" for the Rust code only
        type: choice
        options:
          - baseline
          - x86-64-v3
        default: baseline
        required: true
      repeats:
        description: Decodes in each profiled process, 1 to 100
        default: '10'
        required: true
      base:
        description: A git ref to time against the dispatched ref, with the C library, in this job; empty runs no A/B
        default: ''
        required: false
      rounds:
        description: A/B rounds after one warmup, 11 to 31
        default: '11'
        required: true
      profile:
        description: Run the perf profile; only an A/B run may turn it off
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CORPUS: ${{ inputs.corpus }}
      CODEC: ${{ inputs.codec }}
      TARGET_CPU: ${{ inputs.target_cpu }}
      REPEATS: ${{ inputs.repeats }}
      BASE: ${{ inputs.base }}
      ROUNDS: ${{ inputs.rounds }}
      PROFILE: ${{ inputs.profile }}
      OUT: target/m35/profile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ inputs.base == '' && 1 || 0 }}
      - name: Validate inputs
        run: |
          python3 - <<'EOF'
          import os
          assert os.environ['CORPUS'] in ('silesia', 'dependencies')
          assert os.environ['CODEC'] in ('all', 'zstd', 'xz', 'lzma')
          assert os.environ['TARGET_CPU'] in ('baseline', 'x86-64-v3')
          assert 1 <= int(os.environ['REPEATS']) <= 100
          assert 11 <= int(os.environ['ROUNDS']) <= 31
          assert os.environ['PROFILE'] in ('true', 'false')
          assert os.environ['BASE'] or os.environ['PROFILE'] == 'true', 'profile is off only for an A/B run'
          EOF
      - name: Resolve the base
        if: inputs.base != ''
        run: |
          base=$(git rev-parse --verify --quiet "$BASE^{commit}" || git rev-parse --verify "origin/$BASE^{commit}")
          echo "BASE_COMMIT=$base" >> "$GITHUB_ENV"
          echo "BASE_TREE=$RUNNER_TEMP/zipper-base" >> "$GITHUB_ENV"
          echo "BASE_TARGET=$RUNNER_TEMP/zipper-base-target" >> "$GITHUB_ENV"
          echo "base $BASE is $base, head is $(git rev-parse HEAD)"
      - name: Choose the Rust flags
        if: inputs.target_cpu == 'x86-64-v3'
        run: echo "RUSTFLAGS=-C target-cpu=x86-64-v3" >> "$GITHUB_ENV"
      - name: Install perf and allow it for the job
        if: inputs.base == '' || inputs.profile
        run: |
          set -o pipefail
          kernel=$(uname -r)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-tools-common "linux-tools-$kernel" \
            || sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-azure \
            || sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic \
            || sudo apt-get install -y --no-install-recommends linux-perf
          found=$(ls -d /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf /usr/bin/perf 2>/dev/null | sort || true)
          perf=$(grep -F "/$kernel/" <<<"$found" | head -n1 || true)
          [ -n "$perf" ] || perf=$(tail -n1 <<<"$found")
          test -x "$perf"
          echo "PERF=$perf" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          "$perf" --version
          "$perf" stat -e task-clock -- true
          "$perf" stat -e cycles,instructions -- true || echo "this runner counts no hardware events"
      - name: Record the machine
        if: always()
        run: |
          mkdir -p "$OUT"
          {
            echo "commit $(git rev-parse HEAD)"
            echo "corpus $CORPUS"
            echo "codec $CODEC"
            echo "target_cpu $TARGET_CPU"
            echo "RUSTFLAGS ${RUSTFLAGS:-}"
            echo "repeats $REPEATS"
            echo "base ${BASE:-none} ${BASE_COMMIT:-}"
            echo "rounds $ROUNDS"
            echo "profile $PROFILE"
            uname -a
            if [ -n "${PERF:-}" ]; then "$PERF" --version; fi
            cc --version | head -n1
          } > "$OUT/machine.txt"
          lscpu > "$OUT/lscpu.txt"
      - uses: ./.github/actions/m31-corpus
        with:
          corpus: ${{ inputs.corpus }}
      - name: Record the toolchain
        run: rustc +1.99.1 -vV > "$OUT/rustc.txt"
      - name: Build the decode bench at the base
        if: inputs.base != ''
        run: |
          git worktree add --detach "$BASE_TREE" "$BASE_COMMIT"
          (cd "$BASE_TREE" && cargo +1.99.1 build --release --locked --package zipper-decode-bench \
            --target-dir "$BASE_TARGET")
          test -x "$BASE_TARGET/release/zipper-decode-bench"
      - name: Time the base, the head and the C library
        if: inputs.base != ''
        run: |
          python3 scripts/m35_ab.py --harness target/release/zipper-decode-bench \
            --base-harness "$BASE_TARGET/release/zipper-decode-bench" --base-commit "$BASE_COMMIT" \
            --base-ref "$BASE" --corpus "target/m31/corpus-$CORPUS" --codec "$CODEC" \
            --rounds "$ROUNDS" --out "$OUT"
          cat "$OUT/ab.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Profile
        if: inputs.base == '' || inputs.profile
        run: |
          python3 scripts/m35_profile.py --harness target/release/zipper-decode-bench \
            --corpus "target/m31/corpus-$CORPUS" --codec "$CODEC" --repeats "$REPEATS" \
            --perf "$PERF" --out "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          if-no-files-found: warn
          name: m35-profile-linux-x86_64-${{ inputs.corpus }}-${{ inputs.codec }}-${{ inputs.target_cpu }}
          path: |
            target/m35/profile/
            !target/m35/profile/*.data
            target/m31/corpus-${{ inputs.corpus }}/corpus-source.json
            target/m31/corpus-${{ inputs.corpus }}/streams/corpus.json
