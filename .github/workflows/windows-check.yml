name: Windows check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to test. Empty tests the commit the run was dispatched on.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.149
      - name: Restore the Cargo registry and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-1.99.1
          shared-key: windows-check
          save-if: true
      - name: Clippy
        run: cargo +1.99.1 clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo +1.99.1 nextest run --locked --no-fail-fast --cargo-profile ci --target x86_64-pc-windows-msvc
