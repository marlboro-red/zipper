name: Linux one-off timing

on:
  push:
    branches: [experiment/linux-x86]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal --component llvm-tools
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y 7zip lzip zstd
      - run: benchmarks/linux-oneoff/run.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-oneoff
          path: target/linux-oneoff/
