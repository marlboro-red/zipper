name: ZIP direct output experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            files: 1000
          - os: ubuntu-24.04
            files: 10000
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      FILE_COUNT: ${{ matrix.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Match published Windows build settings
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build reference
        run: |
          cargo +1.96.0 build --locked --release
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          cp "target/release/zipper$suffix" "reference$suffix"
      - name: Apply candidate and verify
        run: |
          git apply benchmarks/native-zip/direct-output/candidate.patch
          cargo +1.96.0 test --locked --release
          cargo +1.96.0 build --locked --release
          mkdir results
          git rev-parse HEAD > results/reference-source.txt
          git diff > results/candidate.patch
          python -c 'import os,platform; print(platform.platform()); print(platform.processor()); print(os.cpu_count())' > results/environment.txt
      - name: Generate workloads
        run: |
          python scripts/make_large_zip_corpus.py corpora/large
          for layout in flat grouped; do
            python scripts/make_tiny_corpus.py "corpora/$layout" --files "$FILE_COUNT" --layout "$layout"
            python - "$layout" <<'PY'
          import sys,zipfile
          from pathlib import Path
          p=Path('corpora')/sys.argv[1]
          with zipfile.ZipFile(p.with_suffix('.zip'),'w',zipfile.ZIP_DEFLATED) as out:
              for f in sorted(p.rglob('*')): out.write(f,f.relative_to(p.parent))
          PY
          done
      - name: Interleave identical ZIP extraction
        run: |
          suffix=''
          extra=()
          if [ "$RUNNER_OS" = Windows ]; then
            suffix=.exe
          fi
          for corpus in large/random large/mixed large/compressible flat grouped; do
            name=${corpus//\//-}
            python scripts/compare_zip_readers.py "corpora/$corpus.zip" "corpora/$corpus" \
              --reader before-native native "reference$suffix" --reader after-native native "target/release/zipper$suffix" \
              --reader before-fast native-fast "reference$suffix" --reader after-fast native-fast "target/release/zipper$suffix" \
              "${extra[@]}" --runs 7 --threads 4 > "results/$name.json"
          done
      - name: Untimed Linux output syscall comparison
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          for binary in ./reference target/release/zipper; do
            name=${binary##*/}
            strace -f -c -o "results/syscalls-$name.txt" "$binary" --zip-engine native-fast --threads 4 extract corpora/grouped.zip -o trace-output
            rm -r trace-output
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zip-direct-output-${{ matrix.os }}-${{ github.sha }}
          path: results/
          if-no-files-found: error
