name: Portable extraction matrix

on:
  workflow_dispatch:
    inputs:
      files:
        description: Tiny files per layout (max 90000)
        default: '10000'
        required: true
      runs:
        description: Measured rounds after one warmup
        default: '7'
        required: true

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MATRIX_FILES: ${{ inputs.files }}
      MATRIX_RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workload limits
        run: |
          python -c 'import os; n=int(os.environ["MATRIX_FILES"]); r=int(os.environ["MATRIX_RUNS"]); assert 1 <= n <= 90000 and 1 <= r <= 31'
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 build --locked --release --examples --bin zipper
      - name: Install Linux baselines
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip libarchive-tools
      - name: Install macOS baseline
        if: runner.os == 'macOS'
        run: command -v 7zz || brew install sevenzip
      - name: Locate baselines
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'SEVENZIP=C:/Program Files/7-Zip/7z.exe' >> "$GITHUB_ENV"
            echo 'BSDTAR=C:/Windows/System32/tar.exe' >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = Linux ]; then
            echo "SEVENZIP=$(command -v 7zz || command -v 7z)" >> "$GITHUB_ENV"
            echo "BSDTAR=$(command -v bsdtar)" >> "$GITHUB_ENV"
          else
            echo "SEVENZIP=$(command -v 7zz)" >> "$GITHUB_ENV"
            echo 'BSDTAR=/usr/bin/tar' >> "$GITHUB_ENV"
          fi
      - name: Record environment
        run: |
          mkdir results
          python -c 'import os,platform,json; print(json.dumps({"platform": platform.platform(), "cpu": platform.processor(), "cpu_count": os.cpu_count(), "runner": os.environ.get("ImageVersion"), "cache": "uncontrolled", "filesystem_and_filters": "see platform-environment.txt"}, indent=2))' > results/environment.json
          rustc +1.96.0 --version > results/compiler.txt
          git rev-parse HEAD > results/source.txt
      - name: Windows filesystem and filter context
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Volume | Format-List DriveLetter,FileSystem,Size,SizeRemaining | Out-File results/platform-environment.txt
          Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled | Format-List | Out-File -Append results/platform-environment.txt
      - name: Unix filesystem context
        if: runner.os != 'Windows'
        run: df -h . > results/platform-environment.txt
      - name: Generate workloads
        run: |
          python scripts/make_tiny_corpus.py corpora/flat --files "$MATRIX_FILES"
          python scripts/make_tiny_corpus.py corpora/grouped --files "$MATRIX_FILES" --layout grouped
          python -c 'from pathlib import Path; import random; p=Path("corpora/single"); p.mkdir(); r=random.Random(20261030); block=r.getrandbits(8*32768).to_bytes(32768,"little") + b"record=example; enabled=true\n"*1024; f=(p/"large.bin").open("wb"); [f.write(block) for _ in range(1024)]; f.close()'
      - name: Measure and verify extraction
        run: |
          binary=target/release/zipper
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          for corpus in flat grouped single; do
            python scripts/extraction_matrix.py "corpora/$corpus" --zipper "$binary" --output "results/$corpus.json" --runs "$MATRIX_RUNS" --threads 1 2 4 8 --sevenzip "$SEVENZIP" --tar "$BSDTAR"
          done
      - name: Separate decode and materialization
        run: |
          # Archives are recreated deterministically for the existing Rust diagnostic.
          python -c 'import zipfile; from pathlib import Path; p=Path("corpora/flat"); z=zipfile.ZipFile("corpora/flat.zip","w",zipfile.ZIP_DEFLATED); [z.write(f, f.relative_to(p.parent)) for f in sorted(p.rglob("*"))]; z.close()'
          target/release/examples/small_zip_costs corpora/flat.zip corpora/flat "$MATRIX_RUNS" 4 > results/costs.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extraction-${{ matrix.os }}-${{ github.sha }}
          path: results/
          if-no-files-found: error
