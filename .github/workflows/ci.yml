name: Rust correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-gnu
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.149
      - name: Restore the Cargo registry and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-1.96.0
          shared-key: gate
          save-if: false
      - name: Restore the 7-Zip download
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/7zip-download/7z.tar.xz
          key: 7zip-26.05-linux-x64-22cf82fcc6eb7474
      - name: Install 7-Zip for the parity archives
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              mkdir -p "$HOME/7zip-download"
              if [ ! -f "$HOME/7zip-download/7z.tar.xz" ]; then
                curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors -o "$HOME/7zip-download/7z.tar.xz" https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz
              fi
              cp "$HOME/7zip-download/7z.tar.xz" /tmp/7z.tar.xz
              echo "22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e  /tmp/7z.tar.xz" | sha256sum -c -
              mkdir -p "$HOME/.local/bin"
              tar -xJf /tmp/7z.tar.xz -C "$HOME/.local/bin" 7zz
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              "$HOME/.local/bin/7zz" | sed -n 2p ;;
            macOS) command -v 7zz || brew install sevenzip ;;
            Windows) echo 'ZIPPER_7Z=C:/Program Files/7-Zip/7z.exe' >> "$GITHUB_ENV" ;;
          esac
      - name: Gate (format, lint, tests, release round trip)
        env:
          ZIPPER_PARITY_REQUIRE_7Z: "1"
        run: cargo +1.96.0 xtask gate full

  warm-cache:
    name: Refresh the build cache for a main that passed the full gate on its ci/ branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-gnu
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.149
      - name: Restore the Cargo registry and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-1.96.0
          shared-key: gate
          save-if: true
      - name: Build what the gate builds, without running it
        run: cargo +1.96.0 xtask warm-cache
