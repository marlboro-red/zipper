name: Rust correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.96.0 fmt --check
      - run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - name: Byte recovery, malformed input, cancellation, and CLI tests
        run: cargo +1.96.0 test --locked --release
