[package]
name = "zipper-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.3"
zipper = { path = "../..", default-features = false, features = ["zip-deflate"] }

[features]
default = ["zip-and-7z"]
zip-and-7z = ["zipper/zip", "zipper/7z"]
