[package]
name = "zipper-decode-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
bzip2-sys = { version = "0.1.13", features = ["static"] }
crc32fast = "1.5.3"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libdeflater = "1.26.1"
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
lzma-rs = "0.3.0"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "optimization", "xz"] }
miniz_oxide = "0.9.1"
rayon = "1.12.0"
ruzstd = "0.9.1"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
xpress-huffman = "0.1.3"
zipper = { path = "../../..", default-features = false, features = ["tar", "zstd", "wim"] }
zlib-rs = "0.6.8"
zstd = "0.14.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0.0", features = ["time"] }

[dev-dependencies]
tempfile = "3.20.0"
