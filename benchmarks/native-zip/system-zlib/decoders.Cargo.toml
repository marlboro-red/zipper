[package]
name = "decoders"
version = "0.0.0"
edition = "2024"

[dependencies]
zip = { version = "9.1.3", default-features = false }
libdeflater = "1.26.1"
flate2 = { version = "1.1.10", default-features = false }

[features]
rs = ["flate2/zlib-rs"]
system = ["flate2/zlib"]
ng = ["flate2/zlib-ng"]

[profile.release]
lto = "thin"
codegen-units = 1
