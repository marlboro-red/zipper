[package]
name = "inflate-probe"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
flate2 = { version = "=1.1.10", default-features = false }
zip = { version = "=9.1.3", default-features = false }
crc32fast = "1.5.3"
libdeflater = { version = "=1.26.1", optional = true }

[features]
rs = ["flate2/zlib-rs"]
system = ["flate2/zlib"]
libdeflate = ["dep:libdeflater"]

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
