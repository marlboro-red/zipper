[workspace]
members = [".", "xtask"]

[package]
name = "zipper"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
aes = { version = "0.9.4", features = ["zeroize"], optional = true }
anyhow = "1.0.104"
bzip2 = { version = "0.6.1", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
crc32fast = "1.5.3"
ctr = { version = "0.10.1", features = ["zeroize"], optional = true }
deflate64 = { version = "0.1.12", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"], optional = true }
hmac = { version = "0.13.0", features = ["zeroize"], optional = true }
md-5 = { version = "0.11.0", default-features = false, optional = true }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"], optional = true }
ppmd-rust = { version = "1.5.2", optional = true }
quick-xml = { version = "0.42.0", optional = true }
rayon = "1.12.0"
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
tempfile = "3.27.0"
walkdir = "2.5.0"
zeroize = { version = "1.9.1", optional = true }
zstd = { version = "0.14.3", optional = true }

[features]
default = ["cli", "all-formats"]
cli = ["dep:clap", "all-formats"]
all-formats = ["zip", "7z", "tar", "more-formats"]
zip = ["dep:aes", "dep:bzip2", "dep:ctr", "dep:deflate64", "dep:flate2", "dep:hmac", "dep:pbkdf2", "dep:ppmd-rust", "dep:sha1", "dep:zeroize", "dep:zstd"]
7z = ["dep:aes", "dep:bzip2", "dep:deflate64", "dep:flate2", "dep:ppmd-rust", "dep:zeroize"]
tar = ["dep:bzip2", "dep:flate2", "dep:ppmd-rust", "dep:zstd"]
more-formats = ["tar", "dep:bzip2", "dep:flate2", "dep:md-5", "dep:quick-xml", "dep:sha1", "dep:zstd"]
counters = []

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
chunks_exact_to_as_chunks = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
debug-assertions = true
overflow-checks = true

[[bin]]
name = "zipper"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "count_zip"
required-features = ["counters", "zip"]

[dev-dependencies]
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "optimization"] }
serde_json = "1.0.154"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
