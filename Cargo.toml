[package]
name = "zipper"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
libdeflater = "1.26.1"
rayon = "1.12.0"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14.3"

[profile.release]
lto = "thin"
codegen-units = 1
