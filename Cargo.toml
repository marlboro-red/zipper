[workspace]
members = [".", "xtask"]

[package]
name = "zipper"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
aes = { version = "0.9.4", features = ["zeroize"] }
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
ctr = { version = "0.10.1", features = ["zeroize"] }
deflate64 = "0.1.12"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
libdeflate-sys = "1.26.1"
md-5 = { version = "0.11.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
ppmd-rust = "1.5.2"
quick-xml = "0.42.0"
rayon = "1.12.0"
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
walkdir = "2.5.0"
zeroize = "1.9.1"
zstd = "0.14.3"

[features]
counters = []

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
debug-assertions = true
overflow-checks = true

[[example]]
name = "count_zip"
required-features = ["counters"]

[dev-dependencies]
libdeflater = "1.26.1"
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
serde_json = "1.0.154"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
